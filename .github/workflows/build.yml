name: Build and verify

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  amiga:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 llvm-18
          sudo apt-get install -y python3-pil

      - name: Build, test against the 68k simulator, package
        env:
          CLANG: clang-18
          LLC: llc-18
          LLVMDIS: llvm-dis-18
        run: tools/ci.sh

      - name: Upload Amiga build
        uses: actions/upload-artifact@v4
        with:
          name: PaulasRevenge-amiga
          path: |
            dist/PaulasRevenge.adf
            dist/PaulasRevenge
            dist/demo.prv
            dist/PaulasRevenge-WinUAE.uae
            dist/PaulasRevenge.fs-uae
            dist/EMULATORS.txt
            README.txt

      - name: Upload test screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verify-output
          path: build/vS
